<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStyle - Shop Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="Newpdf/superstyle_FAVICON.png">
    <style>
        :root {
            --bg-black: #000000;
            --panel-bg: #0C0C0C;
            --card-bg: #111111;
            --text-white: #ffffff;
            --text-gray: #7A7A7A;
            --accent-red: #E53E3E;
            --accent-green: #34C759;
            --font-main: 'Inter', sans-serif;
            --font-logo: 'Archivo Black', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            display: flex;
            align-items: center;
            background: var(--bg-black);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #2C2C2C;
            padding: 0;
        }

        .nav-inner {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 32px;
            width: auto;
            display: none;
        }

        .logo-dark {
            display: block;
        }

        body.light-mode .logo-dark {
            display: none;
        }

        body.light-mode .logo-light {
            display: block;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
            margin-left: auto;
            margin-right: 48px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-white);
            font-size: 14px;
            font-weight: 500;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-links a:hover {
            opacity: 1;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-icon-btn {
            background: #1A1A1A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-icon-btn:hover {
            background: #252525;
            transform: scale(1.05);
            opacity: 0.8;
        }

        /* ========== MAIN LAYOUT ========== */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px 80px;
            gap: 40px;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            margin-bottom: 20px;
            text-transform: none;
        }

        .detected-list {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }

        .detected-item {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 1;
        }

        .detected-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detected-item.active {
            border-color: var(--accent-red);
            opacity: 1;
            transform: scale(1.1);
        }

        .detected-item:hover {
            opacity: 1;
        }

        /* ========== CONTENT AREA ========== */
        .content-area {
            flex-grow: 1;
        }

        /* Result Image Card */
        .source-card {
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .source-img-wrapper {
            width: 100%;
            height: 150px;
        }

        .source-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .source-actions {
            padding: 16px;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            height: 40px;
            flex: 1;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .edit-icon {
            width: 18px;
            height: 18px;
            /* Default white for dark mode (assuming original asset is white) */
            filter: none;
        }

        /* Multiple Items Detected Header */
        aside h3 {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.05em;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 0 12px 0;
        }

        .new-search-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-white);
            width: 100%;
            height: 44px;
            padding: 0 24px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .new-search-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #fff;
        }

        /* Shop Section */
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .shop-header h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
        }

        .shop-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-white);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            /* icons are white, invert for light mode */
        }

        .control-label {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        body.light-mode .control-icon {
            filter: invert(1);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            background: transparent;
            /* border-radius: 12px; */
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 344 / 232;
            /* Derived from Figma's 344x100 but adjusted for visual consistency */
            background: #151515;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-very-similar {
            position: absolute;
            top: 10px;
            left: 10px;
            background: var(--accent-green);
            color: #fff;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
        }

        .heart-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
            z-index: 5;
        }

        .heart-btn svg {
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.5));
        }

        .heart-btn.active {
            color: var(--accent-red);
        }

        .product-brand-tag {
            display: inline-block;
            background: #262626;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            font-weight: 400;
            padding: 8px 16px;
            border-radius: 20px;
            /* Capsule shape */
            margin-bottom: 16px;
        }

        .product-price {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .price-val {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #FFFFFF;
        }

        .product-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #FFFFFF;
            line-height: 1.2;
        }

        .similarity-thumb {
            position: absolute;
            bottom: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .similarity-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* More Results Section */
        .more-results {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .more-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .more-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ========== FOOTER ========== */
        .footer {
            margin-top: 100px;
            padding: 40px;
            border-top: 1px solid #2C2C2C;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .footer-desc {
            max-width: 400px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .footer-desc strong {
            color: var(--accent-red);
            font-weight: 400;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 1;
        }

        .footer-links a:hover {
            color: var(--accent-red);
        }

        .launch-btn {
            width: 48px;
            height: 48px;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .launch-btn:hover {
            background: #252525;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1100px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                padding: 20px;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                margin-bottom: 20px;
            }

            .detected-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 10px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-logo {
                font-size: 24px;
            }

            .nav-links {
                display: none;
            }

            .source-card {
                flex-direction: column;
                width: 100%;
            }

            .source-img-wrapper {
                width: 100%;
                height: 200px;
            }
        }

        /* ========== LIGHT MODE ========== */
        body.light-mode {
            --bg-black: #FFFFFF;
            --panel-bg: #F9F9FB;
            --card-bg: #F0F0F0;
            --text-white: #000000;
            --text-gray: #666666;
            --accent-red: #E53E3E;
        }

        body.light-mode .nav-logo,
        body.light-mode .nav-links a,
        body.light-mode .nav-icon-btn,
        body.light-mode .sidebar h3,
        body.light-mode .product-price,
        body.light-mode .product-name,
        body.light-mode .price-val {
            color: #000000;
        }

        body.light-mode .nav-icon-btn {
            background: #F0F0F0;
            color: #000000;
        }

        body.light-mode .source-card {
            background: #FFFFFF;
            border-color: #E5E5E5;
        }

        body.light-mode .action-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .edit-icon {
            filter: invert(1);
        }

        body.light-mode .new-search-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .product-img-container {
            background: #F2F2F7;
        }

        body.light-mode .product-brand-tag {
            background: #E8E8E8;
            color: #666666;
        }

        body.light-mode .similarity-thumb {
            border-color: rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        body.light-mode .navbar,
        body.light-mode .shop-header {
            border-color: #E5E5E5;
        }

        body.light-mode .control-btn {
            color: #000000;
        }

        body.light-mode .control-btn:hover {
            opacity: 0.7;
            background: transparent;
        }

        body.light-mode .more-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .footer {
            border-top-color: #E5E5E5;
        }

        body.light-mode .footer-links a {
            color: #333333;
        }

        body.light-mode .launch-btn {
            background: #F2F2F7;
        }

        /* Theme Toggle Sync */
        .theme-toggle-btn {
            background: #1A1A1A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .theme-toggle-btn:hover {
            background: #252525;
            transform: scale(1.05);
            opacity: 0.8;
        }

        .theme-icon {
            width: 100%;
            height: 100%;
            display: none;
            border-radius: 10px;
        }

        .theme-icon.sun {
            display: block;
        }

        body.light-mode .theme-icon.sun {
            display: none;
        }

        body.light-mode .theme-icon.moon {
            display: block;
        }

        body.light-mode .theme-toggle-btn {
            background: #F0F0F0;
        }

        body.light-mode .nav-icon-btn:hover,
        body.light-mode .theme-toggle-btn:hover {
            background: #E8E8E8;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="new_landing.html" class="nav-logo">
                <img src="landing_page_assets/LogoandIcons.png" alt="Superstyle" class="logo-img logo-dark">
                <img src="landing_page_assets/lightLogoandIcons.png" alt="Superstyle" class="logo-img logo-light">

    </nav>

    <div class="main-container">
        <aside class="sidebar">
            <div class="source-card">
                <div class="source-img-wrapper">

            <h3>Multiple items detected</h3>

                <div class="detected-item"><img
                        src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=100&h=100&fit=crop"

            <button class="new-search-btn" onclick="window.location.href='new_landing.html'">

                    <circle cx="11" cy="11" r="8" />

                </svg>
                New Search
            </button>
        </aside>

        <main class="content-area">
            <div class="shop-header">

                <div class="shop-controls">

                    <button class="control-btn">

            <div class="product-grid" id="productGrid">

        </main>
    </div>

    <footer class="footer">
        <div class="footer-bottom">
            <div class="footer-left">
                <div class="footer-desc">
                    AI-powered image search for hundreds of stores and brands<br>
                    <strong>find exactly what you're looking for – or the perfect dupe.</strong>

                <div class="footer-links">

            </div>
            <div class="launch-btn">
                <img src="landing_page_assets/footerarrow.png" alt="Launch" style="width: 20px; height: 20px;">
            </div>
        </div>

    <script>
        // Product Data
        const productsData = [
            {
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=400&h=300&fit=crop",
                price: "US$149.00",
                brand: "jakroo-us",
                name: "Performance Jacket (navy)",
                isSimilar: true
            },
            {
                image: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400&h=300&fit=crop",
                price: "US$119.00",
                brand: "jakroo-us",
                name: "Apex Race Vest (red)",
                isSimilar: true
            },
            {
                image: "https://images.unsplash.com/photo-1507679799987-c73779587ccf?w=400&h=300&fit=crop",
                price: "US$299.00",
                brand: "arcteryx.com",
                name: "Atom LT Hoody (black)",
                isSimilar: true

        ];        // Pagination State
        let displayedCount = 8;

        function renderProducts(data) {
            const grid = document.getElementById('productGrid');
            const moreBtnContainer = document.getElementById('moreResultsContainer');

            // Slice data based on displayedCount
            const slicedData = data.slice(0, displayedCount);

            grid.innerHTML = slicedData.map(product => `
                <div class="product-card">
                    <div class="product-img-container">
                        <img src="${product.image}" alt="product">
                        ${product.isSimilar ? '<div class="tag-very-similar">Very similar</div>' : ''}
                        <button class="heart-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                            </svg>
                        </button>
                        <div class="similarity-thumb">
                            <img src="${product.image}" alt="sim">
                        </div>
                    </div>
                    <div class="product-info">
                        <div class="product-price"><span class="price-val">${product.price}</span></div>
                        <div class="product-brand-tag">${product.brand}</div>
                        <div class="product-name">${product.name}</div>
                    </div>
                </div>
            `).join('');

            // Show More Results button only if more products are available
            if (displayedCount < data.length) {
                moreBtnContainer.style.display = 'flex';
            } else {
                moreBtnContainer.style.display = 'none';
            }

            // Re-bind heart button events
            bindHeartButtons();
        }

        function bindHeartButtons() {
            document.querySelectorAll('.heart-btn').forEach(btn => {
                // Remove existing listener to avoid duplicates
                btn.onclick = null;
                btn.onclick = () => {
                    btn.classList.toggle('active');
                    const svg = btn.querySelector('svg');
                    if (btn.classList.contains('active')) {
                        svg.setAttribute('fill', 'currentColor');
                        svg.setAttribute('stroke', 'none');
                    } else {
                        svg.setAttribute('fill', 'none');
                        svg.setAttribute('stroke', 'currentColor');
                        svg.setAttribute('stroke-width', '2');
                    }
                };
            });
        }

        // Initialize rendering
        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(productsData);

            // Add click listener to 'More results' button
            const moreBtn = document.querySelector('.more-btn');
            if (moreBtn) {
                moreBtn.addEventListener('click', () => {
                    displayedCount += 8;
                    renderProducts(productsData);
                });
            }
        });

        // Theme toggle logic sync with landing page
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        // Load saved theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Load searched image data
        const searchImageData = localStorage.getItem('superstyle_search_image');
        if (searchImageData) {
            const sourceImg = document.querySelector('.source-img-wrapper img');
            if (sourceImg) sourceImg.src = searchImageData;

            // Optional: Update first detected item to match for demo consistency
            const firstItemImg = document.querySelector('.detected-item.active img');
            if (firstItemImg) firstItemImg.src = searchImageData;
        }

        // Heart button toggle (initial call not needed as it's handled in renderProducts but keeping for safety if static items added)
        bindHeartButtons();

        // Detected item selection
        document.querySelectorAll('.detected-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.detected-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>
