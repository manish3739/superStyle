<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStyle - Shop Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="Newpdf/superstyle_FAVICON.png">
    <style>
        :root {
            --bg-black: #000000;
            --panel-bg: #0C0C0C;
            --card-bg: #111111;
            --text-white: #ffffff;
            --text-gray: #7A7A7A;
            --accent-red: #E53E3E;
            --accent-green: #34C759;
            --font-main: 'Inter', sans-serif;
            --font-logo: 'Archivo Black', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            display: flex;
            align-items: center;
            background: var(--bg-black);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #2C2C2C;
            padding: 0;
        }

        .nav-inner {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 50px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 32px;
            width: auto;
            display: none;
        }

        .logo-dark {
            display: block;
        }

        body.light-mode .logo-dark {
            display: none;
        }

        body.light-mode .logo-light {
            display: block;
        }

        .nav-links {
            display: none;
            /* Hide old text links if they still exist elsewhere, or remove class entirely */
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .user-profile-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #7B8A96;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            margin-right: 32px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .user-profile-icon:hover {
            opacity: 0.8;
        }

        .nav-icon-btn {
            background: #1A1A1A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .nav-icon-btn:hover {
            background: #252525;
            transform: scale(1.05);
            opacity: 0.8;
        }

        /* ========== MAIN LAYOUT ========== */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 50px 80px;
            gap: 40px;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            margin-bottom: 20px;
            text-transform: none;
        }

        .detected-list {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }

        .detected-item {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 1;
        }

        .detected-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detected-item.active {
            border-color: var(--accent-red);
            opacity: 1;
            transform: scale(1.1);
        }

        .detected-item:hover {
            opacity: 1;
        }

        /* ========== CONTENT AREA ========== */
        .content-area {
            flex-grow: 1;
        }

        /* Result Image Card */
        .source-card {
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .source-img-wrapper {
            width: 100%;
            height: 150px;
        }

        .source-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .source-actions {
            padding: 16px;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            height: 40px;
            flex: 1;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .edit-icon {
            width: 18px;
            height: 18px;
            /* Default white for dark mode (assuming original asset is white) */
            filter: none;
        }

        /* Multiple Items Detected Header */
        aside h3 {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.05em;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 0 12px 0;
        }

        .new-search-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-white);
            width: 100%;
            height: 44px;
            padding: 0 24px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .new-search-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #fff;
        }

        /* Shop Section */
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .shop-header h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
        }

        .shop-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-white);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            /* icons are white, invert for light mode */
        }

        .control-label {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        body.light-mode .control-icon {
            filter: invert(1);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            background: transparent;
            /* border-radius: 12px; */
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background: #151515;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-very-similar {
            position: absolute;
            top: 0;
            left: 0;
            background: var(--accent-green);
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 10px 0 10px 0;
        }

        .heart-btn {
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-white);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .heart-btn svg {
            width: 22px;
            height: 22px;
        }

        .heart-btn.active {
            color: var(--accent-red);
        }

        /* Bottom black gradient on image */
        .img-bottom-shadow {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.85) 0%,
                    rgba(0, 0, 0, 0.45) 45%,
                    rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            border-radius: 0 0 10px 10px;
        }

        .product-brand-tag {
            display: inline-block;
            background: #262626;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            font-weight: 400;
            padding: 8px 16px;
            border-radius: 20px;
            /* Capsule shape */
            margin-bottom: 16px;
        }

        .product-price {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .price-val {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #FFFFFF;
        }

        .product-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #FFFFFF;
            line-height: 1.2;
        }

        /* Similarity thumbnails group (bottom-right of image) */
        .sim-thumbs-group {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .similarity-thumb {
            width: 35px;
            height: 35px;
            border-radius: 60px;
            border: 1px solid #ffffff;
            overflow: hidden;
            background: #000;
            margin-left: -12px;
            flex-shrink: 0;
        }

        .sim-thumbs-group .similarity-thumb:first-child {
            margin-left: 0;
        }

        .similarity-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* More Results Section */
        .more-results {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .more-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .more-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ========== FOOTER ========== */
        .footer {
            margin-top: 100px;
            padding: 40px 0;
            border-top: 1px solid #2C2C2C;
        }

        .footer-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 50px;
            width: 100%;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .footer-desc {
            max-width: 400px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .footer-desc strong {
            color: var(--accent-red);
            font-weight: 400;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 1;
        }

        .footer-links a:hover {
            color: var(--accent-red);
        }

        .launch-btn {
            width: 48px;
            height: 48px;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
        }

        .launch-btn:hover {
            background: #252525;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1100px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                padding: 20px;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                margin-bottom: 20px;
            }

            .detected-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 10px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-logo {
                font-size: 24px;
            }

            .nav-links {
                display: none;
            }

            .source-card {
                flex-direction: column;
                width: 100%;
            }

            .source-img-wrapper {
                width: 100%;
                height: 200px;
            }
        }

        /* ========== LIGHT MODE ========== */
        body.light-mode {
            --bg-black: #FFFFFF;
            --panel-bg: #F9F9FB;
            --card-bg: #F0F0F0;
            --text-white: #000000;
            --text-gray: #666666;
            --accent-red: #680202;
        }

        body.light-mode .nav-logo,
        body.light-mode .nav-links a,
        body.light-mode .nav-icon-btn,
        body.light-mode .sidebar h3,
        body.light-mode .product-price,
        body.light-mode .product-name,
        body.light-mode .price-val {
            color: #000000;
        }

        body.light-mode .nav-icon-btn {
            background: #F0F0F0;
            color: #000000;
        }

        body.light-mode .source-card {
            background: #FFFFFF;
            border-color: #E5E5E5;
        }

        body.light-mode .action-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .edit-icon {
            filter: invert(1);
        }

        body.light-mode .new-search-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .product-img-container {
            background: #F2F2F7;
        }

        body.light-mode .product-brand-tag {
            background: #E8E8E8;
            color: #666666;
        }

        body.light-mode .similarity-thumb {
            border-color: rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        body.light-mode .navbar,
        body.light-mode .shop-header {
            border-color: #E5E5E5;
        }

        body.light-mode .control-btn {
            color: #000000;
        }

        body.light-mode .control-btn:hover {
            opacity: 0.7;
            background: transparent;
        }

        body.light-mode .more-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .footer {
            border-top-color: #E5E5E5;
        }

        body.light-mode .footer-links a {
            color: #333333;
        }

        body.light-mode .launch-btn {
            background: #F2F2F7;
            color: #680202;
        }

        /* Theme Toggle Sync */
        .theme-toggle-btn {
            background: #1A1A1A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .theme-toggle-btn:hover {
            background: #252525;
            transform: scale(1.05);
            opacity: 0.8;
        }

        .theme-icon {
            width: 100%;
            height: 100%;
            display: none;
            border-radius: 10px;
        }

        .theme-icon.sun {
            display: block;
        }

        body.light-mode .theme-icon.sun {
            display: none;
        }

        body.light-mode .theme-icon.moon {
            display: block;
        }

        body.light-mode .theme-toggle-btn {
            background: #F0F0F0;
        }

        body.light-mode .nav-icon-btn:hover,
        body.light-mode .theme-toggle-btn:hover {
            background: #E8E8E8;
        }

        /* ========== SEARCH FLOW OVERLAY ========== */
        .search-flow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .search-flow-overlay.active {
            display: flex;
        }

        /* Crop Card */
        .crop-card {
            background: #1C1C1C;
            width: 440px;
            padding: 40px 20px;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .crop-card.active {
            display: flex;
        }

        .crop-close {
            position: absolute;
            top: 2px;
            right: 5px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .crop-close-img {
            width: 24px;
            height: 24px;
        }

        .crop-image-area {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin-bottom: 5px;
        }

        .crop-image-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .crop-box {
            position: absolute;
            border: 1.5px dashed rgba(255, 255, 255, 0.8);
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            box-sizing: border-box;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .crop-handle {
            position: absolute;
            width: 17px;
            height: 17px;
            background: #fff;
            border-radius: 50%;
            pointer-events: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        .ch-tl {
            top: -7px;
            left: -7px;
            cursor: nw-resize;
        }

        .ch-tr {
            top: -7px;
            right: -7px;
            cursor: ne-resize;
        }

        .ch-bl {
            bottom: -7px;
            left: -7px;
            cursor: sw-resize;
        }

        .ch-br {
            bottom: -7px;
            right: -7px;
            cursor: se-resize;
        }

        .ch-tm {
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            cursor: n-resize;
        }

        .ch-bm {
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            cursor: s-resize;
        }

        .ch-ml {
            left: -7px;
            top: 50%;
            transform: translateY(-50%);
            cursor: w-resize;
        }

        .ch-mr {
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            cursor: e-resize;
        }

        .crop-btn {
            width: 100%;
            height: 58px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 5px;
        }

        .crop-btn.searching {
            background: #34C759;
            color: #fff;
            border: none;
        }

        .change-image-link {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.9;
            margin-top: 5px;
            transition: opacity 0.2s;
        }

        .search-txt {
            font-size: 16px;
            font-weight: 600;
        }

        .change-image-link:hover {
            opacity: 1;
        }

        body.light-mode .crop-close-img {
            filter: invert(1);
            /* Invert white icon to black in light mode */
        }

        body.light-mode .crop-card {
            background: #FFFFFF;
            border: 1px solid #E5E5E5;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        body.light-mode .crop-image-area {
            background: #F0F0F0;
        }

        body.light-mode .crop-btn {
            background: #111111;
            color: #FFFFFF;
            border: 2px solid #000000;
        }

        body.light-mode .crop-btn.searching {
            border: none;
        }

        body.light-mode .crop-btn:hover {
            background: #000000;
        }

        body.light-mode .change-image-link {
            color: #333333;
        }

        body.light-mode .meta-thumb {
            background: #E0E0E0;
        }

        body.light-mode .search-flow-overlay {
            background: rgba(255, 255, 255, 0.5);
        }

        /* ========== POPUP DRAWER ========== */
        .popup-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 8000;
            display: none;
            backdrop-filter: blur(4px);
        }

        .popup-backdrop.active {
            display: block;
        }

        .popup-panel {

                btn.onclick = null;
                btn.onclick = () => {
                    btn.classList.toggle('active');
                    const svg = btn.querySelector('svg');
                    const card = btn.closest('.product-card');
                    if (btn.classList.contains('active')) {
                        svg.setAttribute('fill', 'currentColor');
                        svg.setAttribute('stroke', 'none');
                        // Save to favorites
                        const name = card.querySelector('.product-name')?.textContent || '';

                        svg.setAttribute('stroke', 'currentColor');

                        const name = card.querySelector('.product-name')?.textContent || '';

            renderProducts(shuffledProducts);

            // Add click listener to 'More results' button
            const moreBtn = document.querySelector('.more-btn');
            if (moreBtn) {
                moreBtn.addEventListener('click', () => {
                    displayedCount += 12;
                    renderProducts(shuffledProducts);
                });
            }
        });

        // ========== RANDOM SEARCH ==========
        const RANDOM_SEARCH_IMAGES = [
            'Newpdf/TRENDING/rebeccaferrazwyatt.jpg.webp',
            'Newpdf/TRENDING/GettyImages-2264024758-scaled.jpg',
            'Newpdf/TRENDING/timothée-chalamet-is-a-real-knicks-fan-he-went-to-indiana-v0-bzFsNjNnNHdhMTNmMXyHo3Y9LnyX_naryEToGstekjosQEQ4k8UGpqmYama8.png.webp',
            'Newpdf/RUNWAY/RTW26TREND_Laird-2.png',
            'Newpdf/RUNWAY/37b45c28661ad7057c2620525768ddfa.jpeg',
            'Newpdf/SEEN ON/WUTHERING HEIGHTS.png',
            'Newpdf/SEEN ON/BRIDGERTON.png',
            'Newpdf/HOME/0732c44b-1bdc-4296-bd8c-4a982c292060.jpg.avif',
        ];

        function doRandomSearch() {
            const src = RANDOM_SEARCH_IMAGES[Math.floor(Math.random() * RANDOM_SEARCH_IMAGES.length)];
            const img = new Image();
            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth || 800;
                canvas.height = img.naturalHeight || 1000;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                try {
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                    localStorage.setItem('superstyle_search_image', dataUrl);
                } catch (e) {
                    localStorage.setItem('superstyle_search_image', img.src);
                }
                window.location.reload(); // Just reload with new image
            };
            img.onerror = function () {
                localStorage.setItem('superstyle_search_image', img.src);
                window.location.reload();
            };
            img.src = src;
        }

        // Theme toggle logic sync with landing page
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        // Load saved theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }

        // Load searched image data
        const searchImageData = localStorage.getItem('superstyle_search_image');
        if (searchImageData) {
            const sourceImg = document.querySelector('.source-img-wrapper img');
            if (sourceImg) sourceImg.src = searchImageData;

            // Optional: Update first detected item to match for demo consistency
            const firstItemImg = document.querySelector('.detected-item.active img');
            if (firstItemImg) firstItemImg.src = searchImageData;
        }

        // Heart button toggle (initial call not needed as it's handled in renderProducts but keeping for safety if static items added)
        bindHeartButtons();

        // Detected item selection
        document.querySelectorAll('.detected-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.detected-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
            });
        });
    </script>


    <!-- Popup Backdrop -->

    <!-- Search Flow Overlay -->
    <div id="searchFlowOverlay" class="search-flow-overlay">
        <div id="cropCard" class="crop-card">
            <button class="crop-close" onclick="closeSearchFlow()">
                <img src="landing_page_assets/cross.png" alt="Close" class="crop-close-img">
            </button>
            <div class="crop-image-area">
                <img id="cropImage" src="" alt="crop">
                <div class="crop-box">
                    <div class="crop-handle ch-tl"></div>
                    <div class="crop-handle ch-tr"></div>
                    <div class="crop-handle ch-bl"></div>
                    <div class="crop-handle ch-br"></div>
                    <div class="crop-handle ch-tm"></div>
                    <div class="crop-handle ch-bm"></div>
                    <div class="crop-handle ch-ml"></div>
                    <div class="crop-handle ch-mr"></div>
                </div>
            </div>
            <button id="searchNowBtn" class="crop-btn">
                <svg id="searchIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <path d="m21 21-4.3-4.3" />
                </svg>
                <svg id="checkIcon" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                <span id="searchBtnText" class="search-txt">Search Now</span>
            </button>
            <div class="change-image-link" onclick="triggerFileUpload()">Change image</div>
        </div>
    </div>

    <input type="file" id="mainFileInput" accept="image/*" style="display:none">

    <script>
        /* Search Flow Script */
        const mainFileInput = document.getElementById('mainFileInput');
        const searchFlowOverlay = document.getElementById('searchFlowOverlay');
        const cropCard = document.getElementById('cropCard');
        const searchNowBtn = document.getElementById('searchNowBtn');

        function triggerFileUpload() {
            mainFileInput.click();
        }

        document.querySelector('.new-search-btn').onclick = function (e) {
            e.preventDefault();
            triggerFileUpload();
        };

        mainFileInput.addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
                handleSearchFile(e.target.files[0]);
                this.value = '';
            }
        });

        function handleSearchFile(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const imgData = e.target.result;
                transitionToCrop(imgData);
            };
            reader.readAsDataURL(file);
        }

        function transitionToCrop(imgData) {
            searchFlowOverlay.classList.add('active');
            cropCard.classList.add('active');
            document.getElementById('cropImage').src = imgData;

            // Reset button state
            searchNowBtn.classList.remove('searching');
            document.getElementById('searchIcon').style.display = 'block';
            document.getElementById('checkIcon').style.display = 'none';
            document.getElementById('searchBtnText').textContent = 'Search Now';
            searchNowBtn.style.background = '#fff';
            searchNowBtn.style.color = '#000';

            initCropper();
        }

        // ========== FUNCTIONAL CROPPER LOGIC ==========
        function initCropper() {
            const cropBox = document.querySelector('.crop-box');
            const cropArea = document.querySelector('.crop-image-area');
            const handles = document.querySelectorAll('.crop-handle');

            let isDragging = false;
            let isResizing = false;
            let activeHandle = null;
            let startX, startY, startTop, startLeft, startWidth, startHeight;

            cropBox.style.top = '15%';
            cropBox.style.left = '15%';
            cropBox.style.width = '70%';
            cropBox.style.height = '70%';

            cropBox.style.pointerEvents = 'auto';
            cropBox.style.cursor = 'move';

            cropBox.onmousedown = (e) => {
                if (e.target.classList.contains('crop-handle')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startTop = cropBox.offsetTop;
                startLeft = cropBox.offsetLeft;
                e.preventDefault();
            };

            handles.forEach(handle => {
                handle.onmousedown = (e) => {
                    isResizing = true;
                    activeHandle = handle;
                    startX = e.clientX;
                    startY = e.clientY;
                    startTop = cropBox.offsetTop;
                    startLeft = cropBox.offsetLeft;
                    startWidth = cropBox.offsetWidth;
                    startHeight = cropBox.offsetHeight;
                    e.stopPropagation();
                    e.preventDefault();
                };
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    let dx = e.clientX - startX;
                    let dy = e.clientY - startY;

                    let newLeft = startLeft + dx;
                    let newTop = startTop + dy;

                    newLeft = Math.max(0, Math.min(newLeft, cropArea.offsetWidth - cropBox.offsetWidth));
                    newTop = Math.max(0, Math.min(newTop, cropArea.offsetHeight - cropBox.offsetHeight));

                    cropBox.style.left = newLeft + 'px';
                    cropBox.style.top = newTop + 'px';
                }

                if (isResizing) {
                    let dx = e.clientX - startX;
                    let dy = e.clientY - startY;

                    const h = activeHandle.className;
                    let nL = startLeft, nT = startTop, nW = startWidth, nH = startHeight;

                    if (h.includes('tr')) { nT += dy; nH -= dy; nW += dx; }
                    else if (h.includes('tl')) { nT += dy; nH -= dy; nL += dx; nW -= dx; }
                    else if (h.includes('br')) { nW += dx; nH += dy; }
                    else if (h.includes('bl')) { nL += dx; nW -= dx; nH += dy; }
                    else if (h.includes('tm')) { nT += dy; nH -= dy; }
                    else if (h.includes('bm')) { nH += dy; }
                    else if (h.includes('ml')) { nL += dx; nW -= dx; }
                    else if (h.includes('mr')) { nW += dx; }

                    if (nW > 40 && nH > 40) {
                        if (nL < 0) { nW += nL; nL = 0; }
                        if (nT < 0) { nH += nT; nT = 0; }
                        if (nL + nW > cropArea.offsetWidth) nW = cropArea.offsetWidth - nL;
                        if (nT + nH > cropArea.offsetHeight) nH = cropArea.offsetHeight - nT;

                        cropBox.style.left = nL + 'px';
                        cropBox.style.top = nT + 'px';
                        cropBox.style.width = nW + 'px';
                        cropBox.style.height = nH + 'px';
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                isResizing = false;
                activeHandle = null;
            });
        }

        searchNowBtn.addEventListener('click', function () {
            saveCroppedImage();

            searchNowBtn.classList.add('searching');
            document.getElementById('searchIcon').style.display = 'none';
            document.getElementById('checkIcon').style.display = 'block';
            document.getElementById('searchBtnText').textContent = 'Search Now';
            searchNowBtn.style.background = '#4CAF50';
            searchNowBtn.style.color = '#fff';

            setTimeout(() => {
                window.location.reload();
            }, 800);
        });

        function saveCroppedImage() {
            const img = document.getElementById('cropImage');
            const cropBox = document.querySelector('.crop-box');
            const cropArea = document.querySelector('.crop-image-area');

            if (!img || !cropBox || !cropArea) return;

            const cw = cropArea.offsetWidth;
            const ch = cropArea.offsetHeight;
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;
            const aspect = iw / ih;

            let rw, rh, rl, rt;
            if (iw / ih > cw / ch) {
                rw = cw;
                rh = cw / aspect;
                rl = 0;
                rt = (ch - rh) / 2;
            } else {
                rh = ch;
                rw = ch * aspect;
                rt = 0;
                rl = (cw - rw) / 2;
            }

            const bx = cropBox.offsetLeft;
            const by = cropBox.offsetTop;
            const bw = cropBox.offsetWidth;
            const bh = cropBox.offsetHeight;

            const sx = (bx - rl) * (iw / rw);
            const sy = (by - rt) * (ih / rh);
            const sw = bw * (iw / rw);
            const sh = bh * (ih / rh);

            const canvas = document.createElement('canvas');
            canvas.width = bw;
            canvas.height = bh;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, bw, bh);

            try {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                localStorage.setItem('superstyle_search_image', dataUrl);
            } catch (e) {
                console.error("Save failed", e);
                localStorage.setItem('superstyle_search_image', img.src);
            }
        }

        function closeSearchFlow() {
            searchFlowOverlay.classList.remove('active');
            cropCard.classList.remove('active');
        }


        // ========== POPUP SYSTEM ==========
        let activePopupId = null;

        function openPopup(type) {
            closePopup();
            if (type === 'favorites') {
                renderFavoritesPopup();
                activePopupId = 'favoritesPopup';
            } else if (type === 'recent') {
                renderRecentPopup();
                activePopupId = 'recentPopup';
            }
            if (activePopupId) {
                document.getElementById(activePopupId).classList.add('active');
                document.getElementById('popupBackdrop').classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        function closePopup() {
            document.querySelectorAll('.popup-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('popupBackdrop').classList.remove('active');
            document.body.style.overflow = '';
            activePopupId = null;
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

        // Wire Search nav icon
        document.getElementById('navSearchBtn').addEventListener('click', () => triggerFileUpload());

        // ========== EDIT BUTTON ==========
        function openEditCrop() {
            const img = localStorage.getItem('superstyle_search_image');
            if (img) {
                transitionToCrop(img);
            } else {
                triggerFileUpload();
            }
        }

        // ========== RECENT SEARCHES ==========
        const MAX_RECENT = 5;

        function saveToRecent(imgData) {
            let recents = [];
            try { recents = JSON.parse(localStorage.getItem('superstyle_recent_searches') || '[]'); } catch (e) { }
            // Avoid duplicates (same top-100 chars)
            const key = imgData.substring(0, 100);
            recents = recents.filter(r => (r.src || '').substring(0, 100) !== key);
            recents.unshift({ src: imgData, timestamp: Date.now() });
            if (recents.length > MAX_RECENT) recents.length = MAX_RECENT;
            localStorage.setItem('superstyle_recent_searches', JSON.stringify(recents));
        }

        function timeAgo(ts) {
            const diff = Math.floor((Date.now() - ts) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        function renderRecentPopup() {
            const body = document.getElementById('recentBody');
            let recents = [];
            try { recents = JSON.parse(localStorage.getItem('superstyle_recent_searches') || '[]'); } catch (e) { }
            if (!recents.length) {
                body.innerHTML = '<div class="popup-empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>No recent searches yet.</span></div>';
                return;
            }
            body.innerHTML = recents.map((r, i) => `
                <div class="recent-item">
                    <div class="recent-thumb"><img src="${r.src}" alt="search ${i + 1}"></div>
                    <div class="recent-info">
                        <div class="recent-time">${timeAgo(r.timestamp)}</div>
                        <button class="recent-search-btn" onclick="searchAgainFromRecent(${i})">Search again</button>
                    </div>
                </div>
            `).join('');
        }

        function searchAgainFromRecent(index) {
            let recents = [];
            try { recents = JSON.parse(localStorage.getItem('superstyle_recent_searches') || '[]'); } catch (e) { }
            if (recents[index]) {
                localStorage.setItem('superstyle_search_image', recents[index].src);
                closePopup();
                window.location.reload();
            }
        }

        // ========== FAVORITES ==========
        function saveFavoriteToStorage(fav) {
            let favs = [];
            try { favs = JSON.parse(localStorage.getItem('superstyle_favorites') || '[]'); } catch (e) { }
            const key = fav.name;
            if (!favs.find(f => f.name === key)) {
                favs.unshift(fav);
                localStorage.setItem('superstyle_favorites', JSON.stringify(favs));
            }
        }

        function removeFavoriteFromStorage(name) {
            let favs = [];
            try { favs = JSON.parse(localStorage.getItem('superstyle_favorites') || '[]'); } catch (e) { }
            favs = favs.filter(f => f.name !== name);
            localStorage.setItem('superstyle_favorites', JSON.stringify(favs));
        }

        function renderFavoritesPopup() {
            const body = document.getElementById('favoritesBody');
            let favs = [];
            try { favs = JSON.parse(localStorage.getItem('superstyle_favorites') || '[]'); } catch (e) { }
            if (!favs.length) {
                body.innerHTML = '<div class="popup-empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span>No favorites yet</span></div>';
                return;
            }
            body.innerHTML = favs.map(f => `
                <div class="fav-item">
                    <div class="fav-thumb"><img src="${f.image}" alt="${f.name}"></div>
                    <div class="fav-info">
                        <div class="fav-name">${f.name}</div>
                        <div class="fav-price">${f.price}</div>
                    </div>
                    <button class="fav-remove" onclick="removeFav('${f.name.replace(/'/g, "\\'")}', this)">&#x2715;</button>
                </div>
            `).join('');
        }

        function removeFav(name, btn) {
            removeFavoriteFromStorage(name);
            btn.closest('.fav-item').remove();
            const body = document.getElementById('favoritesBody');
            let favs = [];
            try { favs = JSON.parse(localStorage.getItem('superstyle_favorites') || '[]'); } catch (e) { }
            if (!favs.length) renderFavoritesPopup();
        }

        // ========== AUTO-SAVE CURRENT SEARCH TO RECENT ==========
        document.addEventListener('DOMContentLoaded', () => {
            const img = localStorage.getItem('superstyle_search_image');
            if (img) saveToRecent(img);
        });

    </script>
