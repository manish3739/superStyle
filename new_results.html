<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStyle - Shop Results</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="Newpdf/superstyle_FAVICON.png">
    <style>
        :root {
            --bg-black: #000000;
            --panel-bg: #0C0C0C;
            --card-bg: #111111;
            --text-white: #ffffff;
            --text-gray: #7A7A7A;
            --accent-red: #E53E3E;
            --accent-green: #34C759;
            --font-main: 'Inter', sans-serif;
            --font-logo: 'Archivo Black', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .navbar {
            display: flex;
            align-items: center;
            background: var(--bg-black);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #2C2C2C;
            padding: 0;
        }

        .nav-inner {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 32px;
            width: auto;
            display: none;
        }

        .logo-dark {
            display: block;
        }

        body.light-mode .logo-dark {
            display: none;
        }

        body.light-mode .logo-light {
            display: block;
        }

        .nav-links {
            display: none;
            /* Hide old text links if they still exist elsewhere, or remove class entirely */
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-left: auto;
        }

        .user-profile-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #7B8A96;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 500;
            margin-right: 32px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .user-profile-icon:hover {
            opacity: 0.8;
        }

        .nav-icon-btn {
            background: #1A1A1A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-white);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .nav-icon-btn:hover {
            background: #252525;
            transform: scale(1.05);
            opacity: 0.8;
        }

        /* ========== MAIN LAYOUT ========== */
        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 40px 80px;
            gap: 40px;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            height: fit-content;
        }

        .sidebar h3 {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-gray);
            margin-bottom: 20px;
            text-transform: none;
        }

        .detected-list {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }

        .detected-item {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            opacity: 1;
        }

        .detected-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detected-item.active {
            border-color: var(--accent-red);
            opacity: 1;
            transform: scale(1.1);
        }

        .detected-item:hover {
            opacity: 1;
        }

        /* ========== CONTENT AREA ========== */
        .content-area {
            flex-grow: 1;
        }

        /* Result Image Card */
        .source-card {
            overflow: hidden;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .source-img-wrapper {
            width: 100%;
            height: 150px;
        }

        .source-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .source-actions {
            padding: 16px;
            display: flex;
            flex-direction: row;
            gap: 12px;
        }

        .action-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            height: 40px;
            flex: 1;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .edit-icon {
            width: 18px;
            height: 18px;
            /* Default white for dark mode (assuming original asset is white) */
            filter: none;
        }

        /* Multiple Items Detected Header */
        aside h3 {
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -0.05em;
            color: rgba(255, 255, 255, 0.8);
            margin: 0 0 12px 0;
        }

        .new-search-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: var(--text-white);
            width: 100%;
            height: 44px;
            padding: 0 24px;
            border-radius: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .new-search-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #fff;
        }

        /* Shop Section */
        .shop-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .shop-header h2 {
            font-family: 'DM Sans', sans-serif;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
        }

        .shop-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .control-btn {
            background: transparent;
            border: none;
            padding: 0;
            color: var(--text-white);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 500;
            line-height: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .control-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
            /* icons are white, invert for light mode */
        }

        .control-label {
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        body.light-mode .control-icon {
            filter: invert(1);
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
        }

        .product-card {
            background: transparent;
            /* border-radius: 12px; */
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background: #151515;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-very-similar {
            position: absolute;
            top: 0;
            left: 0;
            background: var(--accent-green);
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 10px 0 10px 0;
        }

        .heart-btn {
            background: transparent;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-white);
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .heart-btn svg {
            width: 22px;
            height: 22px;
        }

        .heart-btn.active {
            color: var(--accent-red);
        }

        /* Bottom black gradient on image */
        .img-bottom-shadow {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.85) 0%,
                    rgba(0, 0, 0, 0.45) 45%,
                    rgba(0, 0, 0, 0) 100%);
            pointer-events: none;
            border-radius: 0 0 10px 10px;
        }

        .product-brand-tag {
            display: inline-block;
            background: #262626;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            font-weight: 400;
            padding: 8px 16px;
            border-radius: 20px;
            /* Capsule shape */
            margin-bottom: 16px;
        }

        .product-price {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .price-val {
            font-family: 'DM Sans', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #FFFFFF;
        }

        .product-name {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #FFFFFF;
            line-height: 1.2;
        }

        /* Similarity thumbnails group (bottom-right of image) */
        .sim-thumbs-group {
            position: absolute;
            bottom: 10px;
            right: 10px;
            display: flex;
            flex-direction: row;
            align-items: center;
        }

        .similarity-thumb {
            width: 35px;
            height: 35px;
            border-radius: 60px;
            border: 1px solid #ffffff;
            overflow: hidden;
            background: #000;
            margin-left: -12px;
            flex-shrink: 0;
        }

        .sim-thumbs-group .similarity-thumb:first-child {
            margin-left: 0;
        }

        .similarity-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* More Results Section */
        .more-results {
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .more-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-white);
            padding: 12px 32px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .more-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ========== FOOTER ========== */
        .footer {
            margin-top: 100px;
            padding: 40px;
            border-top: 1px solid #2C2C2C;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .footer-desc {
            max-width: 400px;
            font-size: 14px;
            color: var(--text-gray);
        }

        .footer-desc strong {
            color: var(--accent-red);
            font-weight: 400;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            color: var(--text-white);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 1;
        }

        .footer-links a:hover {
            color: var(--accent-red);
        }

        .launch-btn {
            width: 48px;
            height: 48px;
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .launch-btn:hover {
            background: #252525;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1100px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                padding: 20px;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                margin-bottom: 20px;
            }

            .detected-list {
                flex-direction: row;
                overflow-x: auto;
                padding-bottom: 10px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 15px 20px;
            }

            .nav-logo {
                font-size: 24px;
            }

            .nav-links {
                display: none;
            }

            .source-card {
                flex-direction: column;
                width: 100%;
            }

            .source-img-wrapper {
                width: 100%;
                height: 200px;
            }
        }

        /* ========== LIGHT MODE ========== */
        body.light-mode {
            --bg-black: #FFFFFF;
            --panel-bg: #F9F9FB;
            --card-bg: #F0F0F0;
            --text-white: #000000;
            --text-gray: #666666;
            --accent-red: #E53E3E;
        }

        body.light-mode .nav-logo,
        body.light-mode .nav-links a,
        body.light-mode .nav-icon-btn,
        body.light-mode .sidebar h3,
        body.light-mode .product-price,
        body.light-mode .product-name,
        body.light-mode .price-val {
            color: #000000;
        }

        body.light-mode .nav-icon-btn {
            background: #F0F0F0;
            color: #000000;
        }

        body.light-mode .source-card {
            background: #FFFFFF;
            border-color: #E5E5E5;
        }

        body.light-mode .action-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .edit-icon {
            filter: invert(1);
        }

        body.light-mode .new-search-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .product-img-container {
            background: #F2F2F7;
        }

        body.light-mode .product-brand-tag {
            background: #E8E8E8;
            color: #666666;
        }

        body.light-mode .similarity-thumb {
            border-color: rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        body.light-mode .navbar,
        body.light-mode .shop-header {
            border-color: #E5E5E5;
        }

        body.light-mode .control-btn {
            color: #000000;
        }

        body.light-mode .control-btn:hover {
            opacity: 0.7;
            background: transparent;
        }

        body.light-mode .more-btn {
            border-color: #D1D1D6;
            color: #000000;
        }

        body.light-mode .footer {
            border-top-color: #E5E5E5;
        }

        body.light-mode .footer-links a {
            color: #333333;
        }

        body.light-mode .launch-btn {
            background: #F2F2F7;
        }

        /* Theme Toggle Sync */
        .theme-toggle-btn {
            background: #1A1A1A;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .theme-toggle-btn:hover {
            background: #252525;
            transform: scale(1.05);
            opacity: 0.8;
        }

        .theme-icon {
            width: 100%;
            height: 100%;
            display: none;
            border-radius: 10px;
        }

        .theme-icon.sun {
            display: block;
        }

        body.light-mode .theme-icon.sun {
            display: none;
        }

        body.light-mode .theme-icon.moon {
            display: block;
        }

        body.light-mode .theme-toggle-btn {
            background: #F0F0F0;
        }

        body.light-mode .nav-icon-btn:hover,
        body.light-mode .theme-toggle-btn:hover {
            background: #E8E8E8;
        }

        /* ========== SEARCH FLOW OVERLAY ========== */
        .search-flow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .search-flow-overlay.active {
            display: flex;
        }

        /* Crop Card */
        .crop-card {
            background: #1C1C1C;
            width: 440px;
            padding: 40px 20px;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .crop-card.active {
            display: flex;
        }

        .crop-close {
            position: absolute;
            top: 2px;
            right: 5px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .crop-close-img {
            width: 24px;
            height: 24px;
        }

        .crop-image-area {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            margin-bottom: 5px;
        }

        .crop-image-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .crop-box {
            position: absolute;
            border: 1.5px dashed rgba(255, 255, 255, 0.8);
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            box-sizing: border-box;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        .crop-handle {
            position: absolute;
            width: 17px;
            height: 17px;
            background: #fff;
            border-radius: 50%;
            pointer-events: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.4);
            z-index: 5;
        }

        .ch-tl {
            top: -7px;
            left: -7px;
            cursor: nw-resize;
        }

        .ch-tr {
            top: -7px;
            right: -7px;
            cursor: ne-resize;
        }

        .ch-bl {
            bottom: -7px;
            left: -7px;
            cursor: sw-resize;
        }

        .ch-br {
            bottom: -7px;
            right: -7px;
            cursor: se-resize;
        }

        .ch-tm {
            top: -7px;
            left: 50%;
            transform: translateX(-50%);
            cursor: n-resize;
        }

        .ch-bm {
            bottom: -7px;
            left: 50%;
            transform: translateX(-50%);
            cursor: s-resize;
        }

        .ch-ml {
            left: -7px;
            top: 50%;
            transform: translateY(-50%);
            cursor: w-resize;
        }

        .ch-mr {
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            cursor: e-resize;
        }

        .crop-btn {
            width: 100%;
            height: 58px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 5px;
        }

        .crop-btn.searching {
            background: #34C759;
            color: #fff;
        }

        .change-image-link {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
            opacity: 0.9;
            margin-top: 5px;
            transition: opacity 0.2s;
        }

        .search-txt {
            font-size: 16px;
            font-weight: 600;
        }

        .change-image-link:hover {
            opacity: 1;
        }

        body.light-mode .crop-close-img {
            filter: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-inner">
            <a href="new_landing.html" class="nav-logo">
                <img src="landing_page_assets/LogoandIcons.png" alt="Superstyle" class="logo-img logo-dark">
                <img src="landing_page_assets/lightLogoandIcons.png" alt="Superstyle" class="logo-img logo-light">
            </a>
            <div class="nav-actions">

                <!-- Home -->
                <a href="new_landing.html" class="nav-icon-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                </a>

                <!-- Search -->
                <button class="nav-icon-btn" onclick="alert('Search clicked')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </button>

                <!-- Favorites / Saved -->

    <script>
        /* Search Flow Script */
        const mainFileInput = document.getElementById('mainFileInput');
        const searchFlowOverlay = document.getElementById('searchFlowOverlay');
        const cropCard = document.getElementById('cropCard');
        const searchNowBtn = document.getElementById('searchNowBtn');

        function triggerFileUpload() {
            mainFileInput.click();
        }

        document.querySelector('.new-search-btn').onclick = function (e) {
            e.preventDefault();
            triggerFileUpload();
        };

        mainFileInput.addEventListener('change', function (e) {
            if (e.target.files && e.target.files[0]) {
                handleSearchFile(e.target.files[0]);
                this.value = '';
            }
        });

        function handleSearchFile(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                const imgData = e.target.result;
                transitionToCrop(imgData);
            };
            reader.readAsDataURL(file);
        }

        function transitionToCrop(imgData) {
            searchFlowOverlay.classList.add('active');
            cropCard.classList.add('active');
            document.getElementById('cropImage').src = imgData;

            // Reset button state
            searchNowBtn.classList.remove('searching');
            document.getElementById('searchIcon').style.display = 'block';
            document.getElementById('checkIcon').style.display = 'none';
            document.getElementById('searchBtnText').textContent = 'Search Now';
            searchNowBtn.style.background = '#fff';
            searchNowBtn.style.color = '#000';

            initCropper();
        }

        // ========== FUNCTIONAL CROPPER LOGIC ==========
        function initCropper() {
            const cropBox = document.querySelector('.crop-box');
            const cropArea = document.querySelector('.crop-image-area');
            const handles = document.querySelectorAll('.crop-handle');

            let isDragging = false;
            let isResizing = false;
            let activeHandle = null;
            let startX, startY, startTop, startLeft, startWidth, startHeight;

            cropBox.style.top = '15%';
            cropBox.style.left = '15%';
            cropBox.style.width = '70%';
            cropBox.style.height = '70%';

            cropBox.style.pointerEvents = 'auto';
            cropBox.style.cursor = 'move';

            cropBox.onmousedown = (e) => {
                if (e.target.classList.contains('crop-handle')) return;
                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;
                startTop = cropBox.offsetTop;
                startLeft = cropBox.offsetLeft;
                e.preventDefault();
            };

            handles.forEach(handle => {
                handle.onmousedown = (e) => {
                    isResizing = true;
                    activeHandle = handle;
                    startX = e.clientX;
                    startY = e.clientY;
                    startTop = cropBox.offsetTop;
                    startLeft = cropBox.offsetLeft;
                    startWidth = cropBox.offsetWidth;
                    startHeight = cropBox.offsetHeight;
                    e.stopPropagation();
                    e.preventDefault();
                };
            });

            window.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    let dx = e.clientX - startX;
                    let dy = e.clientY - startY;

                    let newLeft = startLeft + dx;
                    let newTop = startTop + dy;

                    newLeft = Math.max(0, Math.min(newLeft, cropArea.offsetWidth - cropBox.offsetWidth));
                    newTop = Math.max(0, Math.min(newTop, cropArea.offsetHeight - cropBox.offsetHeight));

                    cropBox.style.left = newLeft + 'px';
                    cropBox.style.top = newTop + 'px';
                }

                if (isResizing) {
                    let dx = e.clientX - startX;
                    let dy = e.clientY - startY;

                    const h = activeHandle.className;
                    let nL = startLeft, nT = startTop, nW = startWidth, nH = startHeight;

                    if (h.includes('tr')) { nT += dy; nH -= dy; nW += dx; }
                    else if (h.includes('tl')) { nT += dy; nH -= dy; nL += dx; nW -= dx; }
                    else if (h.includes('br')) { nW += dx; nH += dy; }
                    else if (h.includes('bl')) { nL += dx; nW -= dx; nH += dy; }
                    else if (h.includes('tm')) { nT += dy; nH -= dy; }
                    else if (h.includes('bm')) { nH += dy; }
                    else if (h.includes('ml')) { nL += dx; nW -= dx; }
                    else if (h.includes('mr')) { nW += dx; }

                    if (nW > 40 && nH > 40) {
                        if (nL < 0) { nW += nL; nL = 0; }
                        if (nT < 0) { nH += nT; nT = 0; }
                        if (nL + nW > cropArea.offsetWidth) nW = cropArea.offsetWidth - nL;
                        if (nT + nH > cropArea.offsetHeight) nH = cropArea.offsetHeight - nT;

                        cropBox.style.left = nL + 'px';
                        cropBox.style.top = nT + 'px';
                        cropBox.style.width = nW + 'px';
                        cropBox.style.height = nH + 'px';
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                isResizing = false;
                activeHandle = null;
            });
        }

        searchNowBtn.addEventListener('click', function () {
            saveCroppedImage();

            searchNowBtn.classList.add('searching');
            document.getElementById('searchIcon').style.display = 'none';
            document.getElementById('checkIcon').style.display = 'block';
            document.getElementById('searchBtnText').textContent = 'Search Now';
            searchNowBtn.style.background = '#4CAF50';
            searchNowBtn.style.color = '#fff';

            setTimeout(() => {
                window.location.reload();
            }, 800);
        });

        function saveCroppedImage() {
            const img = document.getElementById('cropImage');
            const cropBox = document.querySelector('.crop-box');
            const cropArea = document.querySelector('.crop-image-area');

            if (!img || !cropBox || !cropArea) return;

            const cw = cropArea.offsetWidth;
            const ch = cropArea.offsetHeight;
            const iw = img.naturalWidth;
            const ih = img.naturalHeight;
            const aspect = iw / ih;

            let rw, rh, rl, rt;
            if (iw / ih > cw / ch) {
                rw = cw;
                rh = cw / aspect;
                rl = 0;
                rt = (ch - rh) / 2;
            } else {
                rh = ch;
                rw = ch * aspect;
                rt = 0;
                rl = (cw - rw) / 2;
            }

            const bx = cropBox.offsetLeft;
            const by = cropBox.offsetTop;
            const bw = cropBox.offsetWidth;
            const bh = cropBox.offsetHeight;

            const sx = (bx - rl) * (iw / rw);
            const sy = (by - rt) * (ih / rh);
            const sw = bw * (iw / rw);
            const sh = bh * (ih / rh);

            const canvas = document.createElement('canvas');
            canvas.width = bw;
            canvas.height = bh;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, bw, bh);

            try {
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                localStorage.setItem('superstyle_search_image', dataUrl);
            } catch (e) {
                console.error("Save failed", e);
                localStorage.setItem('superstyle_search_image', img.src);
            }
        }

        function closeSearchFlow() {
            searchFlowOverlay.classList.remove('active');
            cropCard.classList.remove('active');
        }
    </script>
